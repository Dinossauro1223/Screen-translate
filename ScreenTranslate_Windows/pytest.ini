[pytest]
testpaths = tests
addopts = -ra -p no:cacheprovider
markers =
    fase0_somente: vale apenas durante a Fase 0 (compara a árvore com o ZIP original)
    fase1_somente: vale apenas durante a Fase 1 (compara a árvore com o manifesto da Fase 1)
    fase2_somente: vale apenas durante a Fase 2 (compara a árvore com o manifesto da Fase 2)
    fase3_somente: vale apenas durante a Fase 3 (compara a árvore com o manifesto da Fase 3)
    fase31_somente: vale apenas durante a Fase 3.1 (compara a árvore com o manifesto da Fase 3.1)
    fase32_somente: vale apenas durante a Fase 3.2 (compara a árvore com o manifesto da Fase 3.2)
    windows: só roda em Windows (não executado na sandbox de Linux; rode no seu computador)
