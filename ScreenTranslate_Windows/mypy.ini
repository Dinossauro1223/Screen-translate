# Verificação de tipos do código do aplicativo (Fase 1). Rodar na raiz: python -m mypy
[mypy]
python_version = 3.10
files = argos_dir.py, bootstrap, geo, capture.py, config.py, context_ai.py, install_language_pack.py, main.py, ocr_engine.py, overlay.py, registro.py, translator.py, worker.py
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

# Bibliotecas sem tipos publicados (ou que podem não estar instaladas no ambiente de teste)
[mypy-rapidocr_onnxruntime.*]
ignore_missing_imports = True

[mypy-argostranslate.*]
ignore_missing_imports = True

[mypy-llama_cpp.*]
ignore_missing_imports = True

[mypy-mss.*]
ignore_missing_imports = True

[mypy-PyQt5.*]
ignore_missing_imports = True
